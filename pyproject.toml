[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bballbot"
version = "0.2.0"
description = "NBA home-team win predictor using NMF latent factors + Kelly-criterion betting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "optuna>=3.3",
    "joblib>=1.3",
    "selenium>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
bballbot = "main:main"

[tool.setuptools.packages.find]
include = ["evaluation*", "features*"]

[tool.setuptools]
py-modules = ["config", "data_processor", "model_trainer", "betting", "utils", "main"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Selenium scrapers set up sys.path / driver options before importing modules.
"scrape_odds.py" = ["E402"]
"enhanced_scrape.py" = ["E402"]
"msi_scrape.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
